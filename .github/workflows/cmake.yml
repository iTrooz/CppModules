name: cmake

on:
  push:
    paths:
      - "**.cpp"
      - "**.ixx"
      - "**.cmake"
      - "**/CMakeLists.txt"
      - ".github/workflows/cmake.yml"

env:
  CTEST_NO_TESTS_ACTION: error
  CTEST_PARALLEL_LEVEL: 0
  CMAKE_BUILD_PARALLEL_LEVEL: 4


jobs:

  windows-msvc:
    runs-on: windows-2025

    env:
      CXX: cl

    steps:
    - uses: actions/checkout@v4

    - run: cmake --workflow --preset default


  windows-llvm:
    runs-on: windows-2025

    env:
      CXX: clang++

    steps:
    - uses: actions/checkout@v4

    - run: cmake --workflow --preset default
