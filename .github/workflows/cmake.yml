name: cmake

on:
  push:
    paths:
      - "**.cpp"
      - "**.ixx"
      - "**.cmake"
      - "**/CMakeLists.txt"
      - ".github/workflows/cmake.yml"

env:
  CTEST_NO_TESTS_ACTION: error
  CTEST_PARALLEL_LEVEL: 0


jobs:

  windows-gcc:
    runs-on: windows-2025

    env:
      CXX: g++

    steps:
    - &checkout
      uses: actions/checkout@v5

    - &default
      run: cmake --workflow default
